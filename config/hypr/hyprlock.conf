
# ╔══════════════════════════════════════════════════════════╗
# ║                     ARCHEL LOCKSCREEN                   ║
# ╚══════════════════════════════════════════════════════════╝


# ──────────────────────────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────────────────────────

background {
    monitor =
    path = ~/.config/hypr/wallpapers/archel.png

    blur_passes = 3
    blur_size = 8

    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.15
}


# ──────────────────────────────────────────────────────────
# CLOCK
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba(ffffffee)
    font_size = 96
    font_family = Sans

    position = 0, 180

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# DATE
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A %d %B')"

    color = rgba(ffffffaa)
    font_size = 22
    font_family = Sans

    position = 0, 95

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# USERNAME
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = $USER

    color = rgba(ffffffff)
    font_size = 20
    font_family = Sans

    position = 0, -135

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# PASSWORD FIELD
# ──────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 360, 60

    position = 0, -70

    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgba(ffffffff)
    inner_color = rgba(00000066)

    font_color = rgba(ffffffff)

    fade_on_empty = false

    placeholder_text = <i>Enter password...</i>

    hide_input = false

    rounding = 12

    check_color = rgba(66cc99ff)
    fail_color = rgba(ff5555ff)
}


# ──────────────────────────────────────────────────────────
# BATTERY
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%"

    color = rgba(ffffffaa)
    font_size = 16
    font_family = Sans

    position = -30, 30

    halign = right
    valign = bottom
}


# ──────────────────────────────────────────────────────────
# ARCHEL BRANDING
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = "ARCHEL"

    color = rgba(ffffff55)
    font_size = 14
    font_family = Sans

    position = 0, 30

    halign = center
    valign = bottom
}
